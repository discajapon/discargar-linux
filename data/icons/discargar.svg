<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1024"/>
      <stop offset="0.55" stop-color="#161238"/>
      <stop offset="1" stop-color="#241246"/>
    </linearGradient>

    <radialGradient id="lensFill" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#bfe0ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6a7dff" stop-opacity="0.08"/>
    </radialGradient>

    <linearGradient id="trail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fd8ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#7fd8ff" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softblur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <clipPath id="frame">
      <rect x="4" y="4" width="120" height="120" rx="27"/>
    </clipPath>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="27" fill="url(#bg)"/>

  <g clip-path="url(#frame)">
    <!-- resplandores ambientales, ecos de las formas tenues del fondo animado de la app -->
    <ellipse cx="30" cy="100" rx="42" ry="30" fill="#3a2fb8" opacity="0.35" filter="url(#softblur)"/>
    <ellipse cx="100" cy="24" rx="34" ry="26" fill="#2fb8a3" opacity="0.25" filter="url(#softblur)"/>

    <!-- estela: el gesto de "descargar" como flujo de luz, no como flecha en caja -->
    <path d="M 96 18 C 78 40, 58 58, 46 96" stroke="url(#trail)" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.85"/>
    <circle cx="45" cy="99" r="5.5" fill="#8fe3ff" filter="url(#glow)"/>

    <!-- lente de cristal inclinada, con aberración cromática cruzándola -->
    <g transform="rotate(-16 66 56)">
      <ellipse cx="66" cy="56" rx="40" ry="30" fill="url(#lensFill)"/>
      <ellipse cx="66" cy="56" rx="40" ry="30" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.4"/>

      <!-- filo claro superior, como en el shader real de la app -->
      <path d="M 30 46 A 40 30 0 0 1 96 44" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" opacity="0.9" filter="url(#glow)"/>

      <!-- franja de aberración cromática -->
      <g opacity="0.9">
        <line x1="30" y1="66" x2="100" y2="46" stroke="#ff5d7a" stroke-width="2.6" stroke-linecap="round" opacity="0.7"/>
        <line x1="32" y1="70" x2="102" y2="50" stroke="#7fe3c8" stroke-width="2.6" stroke-linecap="round" opacity="0.7"/>
        <line x1="34" y1="74" x2="104" y2="54" stroke="#5aa8ff" stroke-width="2.6" stroke-linecap="round" opacity="0.8"/>
      </g>
    </g>
  </g>

  <rect x="4.5" y="4.5" width="119" height="119" rx="26.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
</svg>
